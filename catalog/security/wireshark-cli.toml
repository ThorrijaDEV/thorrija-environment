# Wireshark (CLI) — Network Protocol Analyzer

schema_version = 1

[tool]
name = "wireshark-cli"
category = "security"
description = "Wireshark - network protocol analyzer (CLI tools: tshark, capinfos, editcap)."
homepage = "https://www.wireshark.org/"
tags = ["security", "network", "packet-analysis", "pcap", "tshark"]

[requirements]
ram_run_mb = 128
ram_optimal_mb = 256
disk_install_mb = 100
disk_run_mb = 50
gpu = "none"
cpu_cores_min = 1
cpu_arch = ["x86_64", "aarch64"]
privileged = true
size_class = "medium"
network_required = true
python_min = ""

[profiles]
low_end = "excluded"
standard = "optional"
high_end = "enabled"

[install.native]
arch = "wireshark-cli"
debian = "tshark"
fedora = "wireshark-cli"
void = "wireshark"
opensuse = "wireshark-cli"
alpine = "wireshark-cli"
gentoo = "net-analyzer/wireshark"

[verify]
command = "tshark --version"
pattern = "TShark"
version_extract = "TShark (\\S+)"
exit_code = 0
timeout_sec = 5