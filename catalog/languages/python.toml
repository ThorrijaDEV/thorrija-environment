# Python — Programming Language Runtime

schema_version = 1

[tool]
name = "python"
category = "languages"
description = "Python 3 interpreter and standard library. The motor requires Python ≥ 3.9; this manifest installs/verifies a compatible version."
homepage = "https://www.python.org/"
tags = ["language", "runtime", "essential", "scripting", "ai-ml"]

[requirements]
ram_run_mb = 100
ram_optimal_mb = 500
disk_install_mb = 200
disk_run_mb = 100
gpu = "none"
cpu_cores_min = 1
cpu_arch = ["x86_64", "aarch64", "armv7", "riscv64"]
privileged = true
size_class = "medium"
network_required = false
python_min = "3.9"

[profiles]
low_end = "enabled"
standard = "enabled"
high_end = "enabled"

[install.native]
arch = "python"
debian = "python3"
fedora = "python3"
void = "python3.11"
opensuse = "python3"
alpine = "python3"
gentoo = "dev-lang/python:3.11"

[install.binary_release]
url_template = "https://www.python.org/ftp/python/{version}/Python-{version}.tar.xz"
version = "3.12.7"
sha256 = { x86_64 = "PENDING-VERIFICATION", aarch64 = "PENDING-VERIFICATION" }
archive_type = "tar.xz"
binary_name = "python3"
install_to = "~/.local/bin"
strip_components = 1

[verify]
command = "python3 --version"
pattern = "Python 3\\.(9|1[0-9])\\."
version_extract = "Python (\\S+)"
exit_code = 0
timeout_sec = 5