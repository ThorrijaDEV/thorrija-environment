# Ninja — Small Build System

schema_version = 1

[tool]
name = "ninja"
category = "development"
description = "Ninja - small build system with a focus on speed."
homepage = "https://ninja-build.org/"
tags = ["build", "ninja", "fast", "cmake-companion"]

[requirements]
ram_run_mb = 32
ram_optimal_mb = 64
disk_install_mb = 5
disk_run_mb = 2
gpu = "none"
cpu_cores_min = 1
cpu_arch = ["x86_64", "aarch64", "armv7"]
privileged = true
size_class = "tiny"
network_required = false
python_min = ""

[profiles]
low_end = "optional"
standard = "enabled"
high_end = "enabled"

[install.native]
arch = "ninja"
debian = "ninja-build"
fedora = "ninja-build"
void = "ninja"
opensuse = "ninja"
alpine = "ninja"
gentoo = "dev-util/ninja"

[install.binary_release]
url_template = "https://github.com/ninja-build/ninja/releases/download/v{version}/ninja-linux.zip"
version = "1.12.1"
sha256 = { x86_64 = "PENDING-VERIFICATION", aarch64 = "PENDING-VERIFICATION" }
archive_type = "zip"
binary_name = "ninja"
install_to = "~/.local/bin"
strip_components = 0

[verify]
command = "ninja --version"
pattern = "^\\d+\\.\\d+\\.\\d+"
version_extract = "(\\S+)"
exit_code = 0
timeout_sec = 5