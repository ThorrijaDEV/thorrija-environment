# CMake — Build System Generator

schema_version = 1

[tool]
name = "cmake"
category = "development"
description = "CMake - cross-platform build system generator."
homepage = "https://cmake.org/"
tags = ["build", "cmake", "cpp", "essential"]

[requirements]
ram_run_mb = 128
ram_optimal_mb = 256
disk_install_mb = 100
disk_run_mb = 50
gpu = "none"
cpu_cores_min = 1
cpu_arch = ["x86_64", "aarch64", "armv7", "riscv64"]
privileged = true
size_class = "small"
network_required = false
python_min = ""

[profiles]
low_end = "optional"
standard = "enabled"
high_end = "enabled"

[install.native]
arch = "cmake"
debian = "cmake"
fedora = "cmake"
void = "cmake"
opensuse = "cmake"
alpine = "cmake"
gentoo = "dev-util/cmake"

[install.binary_release]
url_template = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-linux-{arch}.tar.gz"
version = "3.30.5"
sha256 = { x86_64 = "PENDING-VERIFICATION", aarch64 = "PENDING-VERIFICATION" }
archive_type = "tar.gz"
binary_name = "cmake"
install_to = "~/.local/bin"
strip_components = 1

[verify]
command = "cmake --version"
pattern = "cmake version"
version_extract = "cmake version (\\S+)"
exit_code = 0
timeout_sec = 5