# ripgrep — Fast Search Tool

schema_version = 1

[tool]
name = "ripgrep"
category = "system"
description = "ripgrep - recursively searches directories for a regex pattern (faster than grep)."
homepage = "https://github.com/BurntSushi/ripgrep"
tags = ["search", "grep", "rust", "fast", "essential"]

[requirements]
ram_run_mb = 32
ram_optimal_mb = 64
disk_install_mb = 10
disk_run_mb = 5
gpu = "none"
cpu_cores_min = 1
cpu_arch = ["x86_64", "aarch64", "armv7"]
privileged = true
size_class = "small"
network_required = false
python_min = ""

[profiles]
low_end = "enabled"
standard = "enabled"
high_end = "enabled"

[install.native]
arch = "ripgrep"
debian = "ripgrep"
fedora = "ripgrep"
void = "ripgrep"
opensuse = "ripgrep"
alpine = "ripgrep"
gentoo = "app-text/ripgrep"

[install.binary_release]
url_template = "https://github.com/BurntSushi/ripgrep/releases/download/{version}/ripgrep-{version}-{arch}-unknown-linux-musl.tar.gz"
version = "14.1.1"
sha256 = { x86_64 = "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e", aarch64 = "c827481c4ff4ea10c9dc7a4022c8de5db34a5737cb74484d62eb94a95841ab2f" }
archive_type = "tar.gz"
binary_name = "rg"
install_to = "~/.local/bin"
strip_components = 1

[verify]
command = "rg --version | head -1"
pattern = "ripgrep \\d+\\.\\d+\\.\\d+"
version_extract = "ripgrep (\\S+)"
exit_code = 0
timeout_sec = 5