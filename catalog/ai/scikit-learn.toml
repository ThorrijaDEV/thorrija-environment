# scikit-learn — Machine Learning in Python

schema_version = 1

[tool]
name = "scikit-learn"
category = "ai"
description = "scikit-learn - simple and efficient tools for predictive data analysis."
homepage = "https://scikit-learn.org/"
tags = ["ai", "ml", "classification", "regression", "clustering", "essential"]

[requirements]
ram_run_mb = 256
ram_optimal_mb = 512
disk_install_mb = 100
disk_run_mb = 50
gpu = "none"
cpu_cores_min = 1
cpu_arch = ["x86_64", "aarch64", "armv7"]
privileged = false
size_class = "medium"
network_required = true
python_min = "3.9"

[profiles]
low_end = "optional"
standard = "enabled"
high_end = "enabled"

[install.native]
arch = "python-scikit-learn"
debian = "python3-sklearn"
fedora = "python3-scikit-learn"
void = "python3-scikit-learn"
opensuse = "python3-scikit-learn"
alpine = "py3-scikit-learn"
gentoo = "dev-python/scikit-learn"

[install.pipx]
package = "scikit-learn"
version = "1.5.1"
python = "3.9"

[verify]
command = "python3 -c \"import sklearn; print(sklearn.__version__)\""
pattern = "^\\d+\\.\\d+\\.\\d+"
version_extract = "(\\S+)"
exit_code = 0
timeout_sec = 10