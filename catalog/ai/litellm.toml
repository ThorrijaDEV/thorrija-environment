# LiteLLM — Unified LLM API

schema_version = 1

[tool]
name = "litellm"
category = "ai"
description = "LiteLLM - unified API for 100+ LLMs (OpenAI, Anthropic, HuggingFace, Ollama, etc.)."
homepage = "https://github.com/BerriAI/litellm"
tags = ["ai", "llm", "proxy", "unified-api", "python"]

[requirements]
ram_run_mb = 256
ram_optimal_mb = 512
disk_install_mb = 100
disk_run_mb = 50
gpu = "none"
cpu_cores_min = 1
cpu_arch = ["x86_64", "aarch64"]
privileged = false
size_class = "medium"
network_required = true
python_min = "3.9"

[profiles]
low_end = "optional"
standard = "enabled"
high_end = "enabled"

[install.pipx]
package = "litellm"
version = "1.50.0"
python = "3.9"

[verify]
command = "litellm --version"
pattern = "^\\d+\\.\\d+\\.\\d+"
version_extract = "(\\S+)"
exit_code = 0
timeout_sec = 10

[ai_models]
automatic = false
default_models = []
requires_confirmation = true